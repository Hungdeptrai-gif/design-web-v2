<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e5dfd3" stroke-width="0.6" />
    </pattern>
    <pattern id="wallHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1.2" />
    </pattern>
    <marker id="aS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1 L 1 5 L 10 9 z" fill="#0f172a" />
    </marker>
    <marker id="aE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#fcfbf8" />
  <rect x="28" y="28" width="1544" height="944" fill="url(#archGrid)" />
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="32" y="32" width="1536" height="936" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Column Axis Bubbles (Trục A, B, C & 1, 2, 3) -->
  <g transform="translate(95, 115)">
    <text x="450" y="-36" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
      MẶT BẰNG KIẾN TRÚC - NỘI THẤT TẦNG 1 ĐỒNG BỘ TRỤC THANG MÁY KÍNH GIA ĐÌNH (TL 1:50)
    </text>

    <!-- Grid Axes -->
    <g stroke="#b45309" stroke-width="0.9" stroke-dasharray="22 5 4 5">
      <line x1="70" y1="0" x2="70" y2="620" />
      <line x1="450" y1="0" x2="450" y2="620" />
      <line x1="830" y1="0" x2="830" y2="620" />
      <line x1="20" y1="60" x2="885" y2="60" />
      <line x1="20" y1="540" x2="885" y2="540" />
    </g>

    <!-- Axis Circles -->
    <g fill="#ffffff" stroke="#b45309" stroke-width="1.8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      <circle cx="70" cy="-12" r="15" /><text x="70" y="-8" fill="#b45309" stroke="none">1</text>
      <circle cx="450" cy="-12" r="15" /><text x="450" y="-8" fill="#b45309" stroke="none">2</text>
      <circle cx="830" cy="-12" r="15" /><text x="830" y="-8" fill="#b45309" stroke="none">3</text>
      <circle cx="0" cy="60" r="15" /><text x="0" y="64" fill="#b45309" stroke="none">A</text>
      <circle cx="0" cy="540" r="15" /><text x="0" y="544" fill="#b45309" stroke="none">B</text>
    </g>

    <!-- Outer Perimeter Brick Walls (220mm) -->
    <rect x="60" y="50" width="780" height="500" fill="url(#wallHatch)" stroke="#0f172a" stroke-width="2.2" />
    <rect x="82" y="72" width="736" height="456" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />

    <!-- Living Room Sofa & Marble Table Layout (Left Zone) -->
    <rect x="120" y="135" width="215" height="75" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6" />
    <rect x="120" y="210" width="72" height="145" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6" />
    <rect x="225" y="245" width="105" height="68" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <text x="235" y="425" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">KHÔNG GIAN PHÒNG KHÁCH</text>
    <text x="235" y="444" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">COS SÀN: ±0.000 (ĐÁ MARBLE KEM)</text>

    <!-- CENTRAL U-SHAPED STAIRCASE + GLASS HOME ELEVATOR IN STAIRWELL -->
    <g transform="translate(382, 105)">
      <!-- Staircase Treads Wrapping Around Elevator -->
      <rect x="0" y="0" width="196" height="230" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.8" />
      <g stroke="#64748b" stroke-width="1">
        <line x1="0" y1="25" x2="42" y2="25" /><line x1="0" y1="50" x2="42" y2="50" />
        <line x1="0" y1="75" x2="42" y2="75" /><line x1="0" y1="100" x2="42" y2="100" />
        <line x1="0" y1="125" x2="42" y2="125" /><line x1="0" y1="150" x2="42" y2="150" />
        <line x1="0" y1="175" x2="42" y2="175" /><line x1="0" y1="200" x2="42" y2="200" />
        <line x1="154" y1="25" x2="196" y2="25" /><line x1="154" y1="50" x2="196" y2="50" />
        <line x1="154" y1="75" x2="196" y2="75" /><line x1="154" y1="100" x2="196" y2="100" />
        <line x1="154" y1="125" x2="196" y2="125" /><line x1="154" y1="150" x2="196" y2="150" />
        <line x1="154" y1="175" x2="196" y2="175" /><line x1="154" y1="200" x2="196" y2="200" />
      </g>

      <!-- Steel Glass Elevator Core inside Stairwell -->
      <rect x="44" y="45" width="108" height="125" fill="#e0f2fe" stroke="#0f172a" stroke-width="2.4" />
      <line x1="44" y1="45" x2="152" y2="170" stroke="#0284c7" stroke-width="1.2" />
      <line x1="152" y1="45" x2="44" y2="170" stroke="#0284c7" stroke-width="1.2" />
      <text x="98" y="192" font-family="monospace" font-size="10.5" font-weight="bold" fill="#b45309" text-anchor="middle">THANG KÍNH 450KG</text>
      <text x="98" y="208" font-family="monospace" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">1350 × 1400 (GIỮA THANG BỘ)</text>
    </g>

    <!-- Walnut Custom Cabinetry & Dining Zone (Right Zone) -->
    <rect x="625" y="140" width="145" height="230" rx="6" fill="#fafaf9" stroke="#334155" stroke-width="1.6" />
    <rect x="786" y="105" width="28" height="340" fill="#efe6d8" stroke="#b45309" stroke-width="1.6" />
    <text x="697" y="255" font-family="monospace" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">BÀN ĂN 8 GHẾ</text>
    <g transform="translate(804, 275) rotate(-90)">
      <text x="0" y="0" font-family="monospace" font-size="10.5" font-weight="bold" fill="#b45309" text-anchor="middle">HỆ TỦ GỖ ÓC CHÓ ÂM TƯỜNG</text>
    </g>

    <!-- Architectural Dimensions -->
    <line x1="70" y1="595" x2="450" y2="595" stroke="#0f172a" stroke-width="1.3" marker-start="url(#aS)" marker-end="url(#aE)" />
    <text x="260" y="588" font-family="monospace" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">3800 mm</text>

    <line x1="450" y1="595" x2="830" y2="595" stroke="#0f172a" stroke-width="1.3" marker-start="url(#aS)" marker-end="url(#aE)" />
    <text x="640" y="588" font-family="monospace" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">3800 mm</text>

    <line x1="70" y1="635" x2="830" y2="635" stroke="#0f172a" stroke-width="1.5" marker-start="url(#aS)" marker-end="url(#aE)" />
    <text x="450" y="655" font-family="monospace" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">TỔNG TIM TRỤC NGANG = 7600 mm</text>
  </g>

  <!-- ==================== TECHNICAL INTERIOR & PIT NOTES (RIGHT PANEL) ==================== -->
  <g transform="translate(1035, 95)">
    <rect x="0" y="0" width="515" height="655" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <rect x="0" y="0" width="515" height="38" fill="#1e293b" />
    <text x="257" y="24" font-family="monospace" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CHI TIẾT ĐỒNG BỘ HỐ PIT ÂM SÀN &amp; VÁCH GỖ NỘI THẤT
    </text>

    <!-- Pit Section Sketch -->
    <g transform="translate(45, 70)">
      <path d="M 0 90 H 125 V 225 H 295 V 90 H 420 V 125 H 330 V 260 H 90 V 125 H 0 Z" fill="url(#wallHatch)" stroke="#0f172a" stroke-width="2" />
      <rect x="142" y="35" width="136" height="165" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
      <text x="210" y="122" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">KHUNG THÉP THANG KÍNH</text>
      <text x="210" y="216" font-family="monospace" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">HỐ PIT NÔNG H = 450mm</text>
      <text x="210" y="290" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">CHỐNG THẤM SIKA 2 LỚP + ĐÁ LÁT ĐỒNG BỘ SÀN KHÁCH</text>
    </g>

    <line x1="24" y1="395" x2="491" y2="395" stroke="#cbd5e1" stroke-width="1.2" />

    <g font-family="monospace" font-size="11" fill="#1e293b" transform="translate(24, 425)">
      <text x="0" y="0" font-weight="bold" fill="#b45309">DANH MỤC HỒ SƠ ĐỒNG BỘ BÀN GIAO:</text>
      <text x="0" y="32">• Mặt bằng định vị tim trục kết cấu thép hố thang kính.</text>
      <text x="0" y="60">• Bản vẽ chi tiết vách ốp gỗ Óc chó tự nhiên bao quanh cửa tầng.</text>
      <text x="0" y="88">• Sơ đồ cấp nguồn điện 3 pha / 1 pha âm trần &amp; chiếu sáng LED.</text>
      <text x="0" y="116">• Bản vẽ bóc tách sản xuất tủ kệ nội thất rời theo kích thước thực tế.</text>
      <text x="0" y="154" font-weight="bold" fill="#047857">✔ KIẾN TRÚC SƯ &amp; KỸ SƯ THANG MÁY PHỐI HỢP TRÊN CÙNG 1 BẢN VẼ</text>
    </g>
  </g>

  <!-- ==================== KHUNG TÊN BẢN VẼ CHUẨN ISO (BOTTOM-RIGHT) ==================== -->
  <g transform="translate(1020, 790)">
    <rect x="0" y="0" width="548" height="178" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <line x1="0" y1="46" x2="548" y2="46" stroke="#0f172a" stroke-width="1.4" />
    <line x1="0" y1="96" x2="548" y2="96" stroke="#0f172a" stroke-width="1.4" />
    <line x1="0" y1="138" x2="548" y2="138" stroke="#0f172a" stroke-width="1.4" />
    <line x1="340" y1="0" x2="340" y2="178" stroke="#0f172a" stroke-width="1.4" />

    <text x="16" y="29" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">ĐƠN VỊ THIẾT KẾ: PLANITUP STUDIO</text>
    <text x="354" y="29" font-family="monospace" font-size="12" font-weight="bold" fill="#b45309">HOTLINE: 0345.658.936</text>

    <text x="16" y="68" font-family="monospace" font-size="11" fill="#475569">HẠNG MỤC BẢN VẼ:</text>
    <text x="16" y="87" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">MẶT BẰNG NỘI THẤT &amp; THANG KÍNH BIỆT THỰ</text>
    <text x="354" y="68" font-family="monospace" font-size="11" fill="#475569">PHẦN MỀM GỐC:</text>
    <text x="354" y="87" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">AUTOCAD / 3DS MAX</text>

    <text x="16" y="122" font-family="monospace" font-size="11.5" fill="#1e293b">TỶ LỆ: <tspan font-weight="bold">1:50</tspan>   |   KHỔ GIẤY: <tspan font-weight="bold">A2</tspan></text>
    <text x="354" y="122" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">TỜ SỐ: KT-01</text>

    <text x="16" y="163" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">MÃ BẢN VẼ: ARC-VIL-INT-3D09</text>
    <text x="354" y="163" font-family="monospace" font-size="12" font-weight="bold" fill="#047857">ĐỒNG BỘ 100%</text>
  </g>
</svg>
