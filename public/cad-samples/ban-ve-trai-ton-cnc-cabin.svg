<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="gridCnc" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e5dfd3" stroke-width="0.6" />
    </pattern>
    <marker id="dimS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1 L 1 5 L 10 9 z" fill="#0f172a" />
    </marker>
    <marker id="dimE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#fcfbf8" />
  <rect x="28" y="28" width="1544" height="944" fill="url(#gridCnc)" />
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="32" y="32" width="1536" height="936" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title Header -->
  <text x="800" y="74" font-family="monospace" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">
    BẢN VẼ TRẢI PHẲNG TÔN CNC (FLAT PATTERN DXF) — TẤM VÁCH BẢNG ĐIỀU KHIỂN COP &amp; TRẦN CABIN
  </text>

  <!-- ==================== PART 1: FLAT PATTERN COP PANEL (LEFT) ==================== -->
  <g transform="translate(110, 130)">
    <text x="230" y="-12" font-family="monospace" font-size="13.5" font-weight="bold" fill="#b45309" text-anchor="middle">
      CHI TIẾT CT-03A: KHAI TRIỂN TẤM INOX BẢNG COP (SUS304 t=1.5mm)
    </text>

    <!-- Outer Laser Cut Contour with Corner Notches -->
    <path d="M 40 20 H 420 V 45 H 445 V 685 H 420 V 710 H 40 V 685 H 15 V 45 H 40 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />

    <!-- CNC Bend Lines (Chấn 90 độ R1.5) -->
    <line x1="40" y1="45" x2="40" y2="685" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="12 5" />
    <line x1="65" y1="45" x2="65" y2="685" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="12 5" />
    <line x1="395" y1="45" x2="395" y2="685" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="12 5" />
    <line x1="420" y1="45" x2="420" y2="685" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="12 5" />
    <line x1="40" y1="45" x2="420" y2="45" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="12 5" />
    <line x1="40" y1="685" x2="420" y2="685" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="12 5" />

    <!-- LCD Display Cutout -->
    <rect x="175" y="160" width="110" height="145" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.8" />
    <line x1="175" y1="160" x2="285" y2="305" stroke="#94a3b8" stroke-width="1" />
    <line x1="285" y1="160" x2="175" y2="305" stroke="#94a3b8" stroke-width="1" />
    <text x="230" y="238" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">LỖ CẮT MÀN LCD</text>
    <text x="230" y="253" font-family="monospace" font-size="10" fill="#b45309" font-weight="bold" text-anchor="middle">142.0 × 185.0</text>

    <!-- Pushbutton Matrix Ø32.5mm CNC Laser Holes -->
    <g fill="#fef3c7" stroke="#0f172a" stroke-width="1.5">
      <circle cx="202" cy="365" r="14" /><circle cx="258" cy="365" r="14" />
      <circle cx="202" cy="408" r="14" /><circle cx="258" cy="408" r="14" />
      <circle cx="202" cy="451" r="14" /><circle cx="258" cy="451" r="14" />
      <circle cx="202" cy="494" r="14" /><circle cx="258" cy="494" r="14" />
    </g>
    <text x="230" y="534" font-family="monospace" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">8× LỖ NÚT BẤM Ø32.5 ± 0.05</text>

    <!-- Mounting Slots on Flanges -->
    <g fill="#0f172a">
      <rect x="24" y="110" width="7" height="18" rx="3" /><rect x="24" y="355" width="7" height="18" rx="3" /><rect x="24" y="600" width="7" height="18" rx="3" />
      <rect x="429" y="110" width="7" height="18" rx="3" /><rect x="429" y="355" width="7" height="18" rx="3" /><rect x="429" y="600" width="7" height="18" rx="3" />
    </g>

    <!-- Overall Flat Blank Dimensions -->
    <line x1="15" y1="748" x2="445" y2="748" stroke="#0f172a" stroke-width="1.3" marker-start="url(#dimS)" marker-end="url(#dimE)" />
    <text x="230" y="768" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">PHÔI TRẢI PHẲNG W = 496.4 mm (ĐÃ TRỪ HỆ SỐ K=0.42)</text>

    <line x1="-22" y1="20" x2="-22" y2="710" stroke="#0f172a" stroke-width="1.3" marker-start="url(#dimS)" marker-end="url(#dimE)" />
    <g transform="translate(-36, 365) rotate(-90)">
      <text x="0" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">L = 2438.2 mm (±0.1mm)</text>
    </g>
  </g>

  <!-- ==================== PART 2: CEILING LASER PATTERN & BEND PROFILE (RIGHT TOP) ==================== -->
  <g transform="translate(680, 130)">
    <text x="400" y="-12" font-family="monospace" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">
      CHI TIẾT CT-07: TRẢI TÔN KHAY TRẦN ĐÈN LED &amp; BIÊN DẠNG CHẤN GẤP CNC
    </text>

    <rect x="30" y="20" width="740" height="390" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <rect x="65" y="55" width="670" height="320" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="14 5" />

    <!-- Ventilation & LED Acrylic Diffuser Slots -->
    <rect x="135" y="105" width="530" height="220" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="1.8" />
    <g stroke="#0f172a" stroke-width="1.4" fill="#fef3c7">
      <rect x="85" y="120" width="28" height="8" rx="4" /><rect x="85" y="145" width="28" height="8" rx="4" />
      <rect x="85" y="170" width="28" height="8" rx="4" /><rect x="85" y="280" width="28" height="8" rx="4" /><rect x="85" y="305" width="28" height="8" rx="4" />
      <rect x="687" y="120" width="28" height="8" rx="4" /><rect x="687" y="145" width="28" height="8" rx="4" />
      <rect x="687" y="170" width="28" height="8" rx="4" /><rect x="687" y="280" width="28" height="8" rx="4" /><rect x="687" y="305" width="28" height="8" rx="4" />
    </g>
    <text x="400" y="212" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">KHOANG LẮP TẤM XUYÊN SÁNG LED TRẦN</text>
    <text x="400" y="234" font-family="monospace" font-size="11.5" fill="#0284c7" font-weight="bold" text-anchor="middle">KÍCH THƯỚC CẮT LASER: 1080.0 × 960.0 mm</text>

    <!-- Bend Sequence Diagram -->
    <g transform="translate(30, 455)">
      <rect x="0" y="0" width="740" height="175" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
      <text x="20" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#dc2626">
        BIÊN DẠNG CHẤN DẬP THỦY LỰC (BEND SEQUENCE — DÀNH CHO THỢ ĐỨNG MÁY AMADA):
      </text>
      <!-- Bent U-Return Flange Graphic -->
      <path d="M 50 135 H 280 V 75 H 335 V 105" fill="none" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
      <path d="M 690 135 H 460 V 75 H 405 V 105" fill="none" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
      <text x="275" y="64" font-family="monospace" font-size="10.5" font-weight="bold" fill="#dc2626">CHẤN 1: LÊN 90° (25mm)</text>
      <text x="330" y="128" font-family="monospace" font-size="10.5" font-weight="bold" fill="#b45309">CHẤN 2: GẬP MÍ 90° (15mm)</text>
      <text x="370" y="158" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Bề mặt có màng bảo vệ hướng vào lòng cối chấn không trầy xước</text>
    </g>
  </g>

  <!-- ==================== KHUNG TÊN BẢN VẼ CHUẨN ISO (BOTTOM-RIGHT) ==================== -->
  <g transform="translate(1020, 790)">
    <rect x="0" y="0" width="548" height="178" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <line x1="0" y1="46" x2="548" y2="46" stroke="#0f172a" stroke-width="1.4" />
    <line x1="0" y1="96" x2="548" y2="96" stroke="#0f172a" stroke-width="1.4" />
    <line x1="0" y1="138" x2="548" y2="138" stroke="#0f172a" stroke-width="1.4" />
    <line x1="340" y1="0" x2="340" y2="178" stroke="#0f172a" stroke-width="1.4" />

    <text x="16" y="29" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">ĐƠN VỊ THIẾT KẾ: THIETKEKYTHUAT</text>
    <text x="354" y="29" font-family="monospace" font-size="12" font-weight="bold" fill="#b45309">HOTLINE: 0947.147.858</text>

    <text x="16" y="68" font-family="monospace" font-size="11" fill="#475569">HẠNG MỤC BẢN VẼ:</text>
    <text x="16" y="87" font-family="monospace" font-size="12.5" font-weight="bold" fill="#0f172a">TRẢI PHẲNG TÔN CHẤN ĐỘT CNC (.DXF)</text>
    <text x="354" y="68" font-family="monospace" font-size="11" fill="#475569">VẬT LIỆU TẤM:</text>
    <text x="354" y="87" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">SUS304 PVD DÀY 1.5mm</text>

    <text x="16" y="122" font-family="monospace" font-size="11.5" fill="#1e293b">TỶ LỆ: <tspan font-weight="bold">1:5</tspan>   |   XUẤT FILE: <tspan font-weight="bold">LASER .DXF</tspan></text>
    <text x="354" y="122" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">TỜ SỐ: 02 / 02</text>

    <text x="16" y="163" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a">MÃ BẢN VẼ: CNC-ELV-SHEET-02</text>
    <text x="354" y="163" font-family="monospace" font-size="12" font-weight="bold" fill="#047857">DUNG SAI ±0.1mm</text>
  </g>
</svg>
